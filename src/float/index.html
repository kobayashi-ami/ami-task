<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>AmiTask</title>
    <link rel="stylesheet" href="float.css" />
  </head>
  <body>
    <!-- The membrane itself -->
    <canvas id="membrane"></canvas>

    <!-- The project, suspended inside the film -->
    <div id="stage">
      <div id="name" class="name">—</div>
      <div id="task" class="task empty">
        <span id="task-text">…</span>
      </div>
      <div id="branch" class="branch"></div>
      <button id="edit" class="edit" title="Edit (⌘⇧Space)" aria-label="Edit">✎</button>
    </div>

    <script src="float.js"></script>
  </body>
</html>
