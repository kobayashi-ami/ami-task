<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>AmiTask — Note</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <!-- The enclosure: a real object sitting on your desk. -->
    <div class="enclosure">
      <span class="screw tl"></span>
      <span class="screw tr"></span>
      <span class="screw bl"></span>
      <span class="screw br"></span>

      <!-- Title bar with the old 1-bit striped chrome -->
      <div class="titlebar">
        <button id="close" class="closebox" title="Close (Esc)" aria-label="Close"></button>
        <div class="stripes"></div>
        <div class="title">T A S K&nbsp;&nbsp;N O T E</div>
        <div class="stripes"></div>
        <div class="titlebar-spacer"></div>
      </div>

      <!-- The recessed phosphor display where you write -->
      <div class="screen">
        <div class="scanlines"></div>
        <textarea
          id="note"
          spellcheck="false"
          placeholder="Write the one task you must not forget…"
        ></textarea>
      </div>

      <!-- Control deck -->
      <div class="deck">
        <div class="plate">AMI&nbsp;·&nbsp;MODEL&nbsp;01</div>
        <div class="meta" id="meta"></div>
        <div class="buttons">
          <button id="cancel" class="btn">Cancel</button>
          <button id="save" class="btn primary">Save&nbsp;↵</button>
        </div>
      </div>
    </div>

    <script src="editor.js"></script>
  </body>
</html>
